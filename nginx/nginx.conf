# =============================================================================
# AfriBot — Nginx reverse proxy
# Seuls les ports 80 (redirection + certbot) et 443 (HTTPS) sont publics.
# =============================================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # ---------------------------------------------------------------------------
    # Compression gzip — optimisation connexions lentes (2G/3G)
    # NB : gzip sur JPEG/PNG est demandé par la spec (peu efficace sur images
    # déjà compressées, mais réduit les payloads JSON+images mixtes).
    # ---------------------------------------------------------------------------
    gzip on;
    gzip_types text/plain application/json image/jpeg image/png;
    gzip_min_length 1024;

    # Upload images catalogue (compression sharp < 100 Ko côté app)
    client_max_body_size 10M;

    # -------------------------------------------------------------------------
    # Upstream — services du réseau Docker interne
    # -------------------------------------------------------------------------
    upstream afribot {
        server afribot_app:3001;
    }
    upstream evolution {
        server afribot_evolution:8080;
    }
    upstream chatwoot {
        server afribot_chatwoot:3000;
    }
    upstream n8n {
        server afribot_n8n:5678;
    }

    # -------------------------------------------------------------------------
    # Serveur HTTP (port 80) — challenge Let's Encrypt + redirection HTTPS
    # -------------------------------------------------------------------------
    server {
        listen 80;
        # Remplacer _ par le domaine en production (ex: tonbot.com)
        server_name _;

        # Validation du domaine par Let's Encrypt (certbot)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Tout le reste est redirigé vers HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # Serveur HTTPS (port 443)
    # -------------------------------------------------------------------------
    server {
        listen 443 ssl;
        http2 on;
        # Remplacer _ par le domaine en production (ex: tonbot.com)
        server_name _;

        # Certificats SSL (Let's Encrypt)
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;

        # Protocoles TLS modernes uniquement
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;

        # En-têtes de sécurité
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;

        # En-têtes de proxy communs
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Webhooks Evolution API -> AfriBot (réponse rapide, timeout court)
        location /webhook/ {
            proxy_pass http://afribot;
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # API AfriBot (dashboard commerçant) -> timeout étendu
        location /api/ {
            proxy_pass http://afribot;
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # Evolution API — le préfixe /evolution/ est retiré (proxy_pass avec /)
        location /evolution/ {
            proxy_pass http://evolution/;
        }

        # Chatwoot — le préfixe /chatwoot/ est retiré (proxy_pass avec /)
        location /chatwoot/ {
            proxy_pass http://chatwoot/;
        }

        # n8n — le préfixe /n8n/ est retiré (N8N_PATH=/n8n/ côté n8n)
        location /n8n/ {
            proxy_pass http://n8n/;
            proxy_http_version 1.1;
            # WebSocket (éditeur n8n temps réel)
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 300s;
        }

        # Fallback : tout le reste va à l'application AfriBot
        location / {
            proxy_pass http://afribot;
        }
    }
}
