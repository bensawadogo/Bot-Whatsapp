# =============================================================================
# AfriBot — docker-compose.yml
# Stack : PostgreSQL, Redis, Evolution API (Cloud API Meta officiel),
# application AfriBot, Chatwoot (Rails + Sidekiq), Nginx reverse proxy.
#
# RÈGLE ABSOLUE : aucune image, variable ou service lié à Baileys, QR code
# WhatsApp ou whatsapp-web.js. Uniquement la Cloud API Meta officielle.
#
# Les variables ${...} sont interpolées depuis le fichier .env à la racine.
# Seuls les ports 80 et 443 (Nginx) sont exposés vers l'extérieur.
# =============================================================================

name: afribot

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL — données persistantes (commandes, catalogue, instances)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: afribot_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Bases supplémentaires à créer (lues par scripts/init-db.sh)
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES:-chatwoot_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Script d'initialisation exécuté par l'image officielle postgres
      # au PREMIER démarrage uniquement (volume vide)
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - afribot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. Redis — sessions conversationnelles (TTL 30 min) + cache
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: afribot_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - afribot-network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${REDIS_PASSWORD} ping | grep PONG"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # 3. Evolution API — passerelle officielle Cloud API Meta (jamais Baileys)
  #    Port 8080 accessible uniquement en interne (via Nginx)
  # ---------------------------------------------------------------------------
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: afribot_evolution
    restart: unless-stopped
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances
    networks:
      - afribot-network
    environment:
      # Serveur
      SERVER_URL: ${EVOLUTION_SERVER_URL}
      SERVER_PORT: "8080"
      # Authentification Evolution API
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      # Mode Cloud API Meta officiel UNIQUEMENT (Baileys interdit)
      INTEGRATION: ${INTEGRATION}
      # Base de données
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: >-
        postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      # Cache Redis (DB 1 dédiée à Evolution)
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379/1
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      # WhatsApp Business — Cloud API Meta officiel (OBLIGATOIRE, jamais Baileys)
      WA_BUSINESS_TOKEN_WEBHOOK: ${WA_BUSINESS_TOKEN_WEBHOOK}
      WA_BUSINESS_URL: https://graph.facebook.com
      WA_BUSINESS_VERSION: v20.0
      WA_BUSINESS_LANGUAGE: fr
      # Webhook global vers AfriBot
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_URL: ${AFRIBOT_WEBHOOK_URL}
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      # Typebot/Chatwoot gérés directement par AfriBot (désactivés côté Evolution)
      TYPEBOT_ENABLED: "false"
      CHATWOOT_ENABLED: "false"

  # ---------------------------------------------------------------------------
  # 4. AfriBot — application Node.js/TypeScript (webhooks, machine à états)
  # ---------------------------------------------------------------------------
  afribot:
    build: .
    container_name: afribot_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      evolution-api:
        condition: service_started
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    networks:
      - afribot-network
    expose:
      - "3001"
    environment:
      NODE_ENV: ${NODE_ENV}
      PORT: "3001"
      # Dans le réseau Docker, les hôtes sont les noms de services
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      APP_URL: ${APP_URL}
      LOG_LEVEL: ${LOG_LEVEL}
      # Cloud API Meta (variables OBLIGATOIRES — fail-fast env.ts)
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME}
      INTEGRATION: WHATSAPP-BUSINESS
      WA_BUSINESS_TOKEN_WEBHOOK: ${WA_BUSINESS_TOKEN_WEBHOOK}
      WA_BUSINESS_URL: ${WA_BUSINESS_URL}
      WA_BUSINESS_VERSION: ${WA_BUSINESS_VERSION}
      # Dashboard commerçant (JWT + admin)
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      DASHBOARD_ADMIN_EMAIL: ${DASHBOARD_ADMIN_EMAIL}
      DASHBOARD_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD}
      # Notifications + horaires commerçant (optionnels)
      MERCHANT_ID: ${MERCHANT_ID}
      MERCHANT_NAME: ${MERCHANT_NAME}
      MERCHANT_PHONE: ${MERCHANT_PHONE}
      MERCHANT_TIMEZONE: ${MERCHANT_TIMEZONE}
      MERCHANT_OPEN_HOUR: ${MERCHANT_OPEN_HOUR}
      MERCHANT_CLOSE_HOUR: ${MERCHANT_CLOSE_HOUR}
      # MODE B — virement direct Wave / Orange Money / Moov (repli)
      MERCHANT_WAVE_NUMBER: ${MERCHANT_WAVE_NUMBER}
      MERCHANT_ORANGE_NUMBER: ${MERCHANT_ORANGE_NUMBER}
      MERCHANT_MOOV_NUMBER: ${MERCHANT_MOOV_NUMBER}
      # MODE C — PawaPay (agrégateur)
      PAWAPAY_API_TOKEN: ${PAWAPAY_API_TOKEN}
      PAWAPAY_ENVIRONMENT: ${PAWAPAY_ENVIRONMENT}
      # Paiements CinetPay (MODE A/B/C par défaut de repli)
      CINETPAY_SITE_ID: ${CINETPAY_SITE_ID}
      CINETPAY_API_KEY: ${CINETPAY_API_KEY}
      CINETPAY_NOTIFY_URL: ${CINETPAY_NOTIFY_URL}
      CINETPAY_CURRENCY: ${CINETPAY_CURRENCY}
      # Paiements FedaPay (alternative)
      FEDAPAY_SECRET_KEY: ${FEDAPAY_SECRET_KEY}
      FEDAPAY_PUBLIC_KEY: ${FEDAPAY_PUBLIC_KEY}
      FEDAPAY_ENVIRONMENT: ${FEDAPAY_ENVIRONMENT}
      # Chatwoot (support humain)
      CHATWOOT_URL: ${CHATWOOT_URL}
      CHATWOOT_API_KEY: ${CHATWOOT_API_KEY}
      CHATWOOT_INBOX_ID: ${CHATWOOT_INBOX_ID}
      CHATWOOT_ACCOUNT_ID: ${CHATWOOT_ACCOUNT_ID}
      # n8n (automatisations)
      N8N_URL: ${N8N_URL}
      N8N_API_KEY: ${N8N_API_KEY}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Voix (Phase 6) — transcription message vocal
      DIGIDAYS_API_TOKEN: ${DIGIDAYS_API_TOKEN}
      SMILGO_ENDPOINT: ${SMILGO_ENDPOINT}
      SMILGO_API_TOKEN: ${SMILGO_API_TOKEN}

  # ---------------------------------------------------------------------------
  # 5 & 6. Chatwoot — support humain (Rails web + Sidekiq jobs)
  # NB : la base chatwoot_db est créée automatiquement par
  # scripts/init-db.sh au premier démarrage de PostgreSQL.
  # Si le volume postgres_data existe déjà, la créer à la main :
  #   docker compose exec postgres createdb -U ${POSTGRES_USER} chatwoot_db
  # ---------------------------------------------------------------------------
  chatwoot-rails:
    image: chatwoot/chatwoot:latest
    container_name: afribot_chatwoot
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    entrypoint: docker/entrypoints/rails.sh
    command: bundle exec rails s -p 3000 -b 0.0.0.0
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - afribot-network
    expose:
      - "3000"
    environment: &chatwoot-env
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      FRONTEND_URL: ${CHATWOOT_URL}
      DEFAULT_LOCALE: fr
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/chatwoot_db
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  chatwoot-sidekiq:
    image: chatwoot/chatwoot:latest
    container_name: afribot_sidekiq
    restart: unless-stopped
    depends_on:
      - chatwoot-rails
    command: bundle exec sidekiq -C config/sidekiq.yml
    volumes:
      - chatwoot_storage:/app/storage
    networks:
      - afribot-network
    environment: *chatwoot-env

  # ---------------------------------------------------------------------------
  # 7. n8n — automatisations (rapports journalier/hebdo, relances 24h,
  #    alertes stock bas, broadcasts opt-in). Self-hosted, base SQLite
  #    persistée dans le volume n8n_data. Exposé via Nginx /n8n/ (HTTPS).
  #    Les workflows importables sont dans n8n/workflows/.
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: afribot_n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - afribot-network
    environment:
      # n8n derrière le reverse proxy Nginx (sous-chemin /n8n/)
      N8N_HOST: ${N8N_HOST:-tonbot.com}
      N8N_PATH: /n8n/
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      WEBHOOK_URL: ${EVOLUTION_SERVER_URL}/n8n/
      # Clé de chiffrement des credentials (obligatoire en production)
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # Timezone Afrique de l'Ouest pour les triggers cron
      GENERIC_TIMEZONE: ${MERCHANT_TIMEZONE}
      # Telemetry désactivée (self-hosted, données clients)
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      # Accès AfriBot API (données : /api/stats, /api/orders)
      AFRIBOT_API_URL: http://afribot_app:3001
      AFRIBOT_ADMIN_EMAIL: ${DASHBOARD_ADMIN_EMAIL}
      AFRIBOT_ADMIN_PASSWORD: ${DASHBOARD_ADMIN_PASSWORD}
      # Accès Evolution API (envoi WhatsApp des rapports/relances/broadcasts)
      EVOLUTION_API_URL: ${EVOLUTION_API_URL}
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME}
      MERCHANT_PHONE: ${MERCHANT_PHONE}
      MERCHANT_TIMEZONE: ${MERCHANT_TIMEZONE}

  # ---------------------------------------------------------------------------
  # 8. Nginx — reverse proxy HTTPS (seuls ports publics de la stack)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: afribot_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - afribot
      - chatwoot-rails
      - evolution-api
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/certbot/www:/var/www/certbot:ro
    networks:
      - afribot-network

# -----------------------------------------------------------------------------
# Volumes nommés persistants
# -----------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  evolution_instances:
  chatwoot_storage:
  n8n_data:

# -----------------------------------------------------------------------------
# Réseau Docker interne unique
# -----------------------------------------------------------------------------
networks:
  afribot-network:
    driver: bridge
